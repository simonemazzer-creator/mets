# Tiene sveglio il database dell'app Mazzer Contatti (Supabase gratuito si sospende dopo 7 giorni senza attività).
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */2 * *"   # ogni 2 giorni alle 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY="sb_publishable_gUwDeJD8phbZOeaCvq5SWw_BZIaXswW"
          URL="https://qrgkuhmgicmepyoomiij.supabase.co"
          R=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/contatti?select=id&limit=1" -H "apikey: $KEY")
          A=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" -H "apikey: $KEY")
          echo "rest=$R auth=$A"
          [ "$A" = "200" ] && [ "$R" -lt 500 ]
