@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
/* Variante "Griglia": bianco, logo al centro, 4 riquadri fotografici, contatti sotto */
:root{--bg:#ffffff;--soft:#f2f4f7;--fg:#17263a;--muted:#626e7d;--navy:#1f3550;--grey:#959394;--line:#e3e7ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Mulish",-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end}
.lang{position:relative}
.lang button{font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.08em;color:var(--navy);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.lang ul{position:absolute;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(15,30,50,.2);min-width:150px;z-index:5}
.lang ul[hidden]{display:none}
.lang li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;font-size:.92rem;cursor:pointer}
.lang li button[aria-current="true"]{background:var(--soft);font-weight:700}
.brand{text-align:center;margin:6px 0 22px}
.brand img{width:min(250px,70%);margin:0 auto 14px;display:block}
.brand .k{font-size:.68rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--grey)}
.brand h1{margin:8px auto 0;font-size:1.25rem;font-weight:800;line-height:1.25;max-width:22em;text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;margin:18px auto 0;width:120px}
.rule i{flex:1;height:2px;background:var(--navy)}.rule i+i{height:1px;background:var(--grey)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:1/1.08;border-radius:16px;overflow:hidden;background:var(--soft);display:block}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.04)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,28,46,0) 35%,rgba(15,28,46,.85) 100%)}
.tile span{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;color:#fff;font-weight:800;font-size:1rem;line-height:1.2;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile span svg{flex:none;width:18px;height:18px}
.tile.wide{grid-column:1/-1;aspect-ratio:2.1/1}
.sec{margin-top:26px}
.sec h2{font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin:0 0 10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.person:last-of-type{border-bottom:1px solid var(--line)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.who{flex:1;min-width:0}.who b{display:block}.who small{color:var(--muted)}
.btns{display:flex;gap:6px}
.btns a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--navy)}
.btns a.save{background:var(--navy);color:#fff}
.btns svg{width:18px;height:18px}
.social{display:flex;gap:8px;flex-wrap:wrap}
.social a{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:.88rem;color:var(--navy)}
.social svg{width:18px;height:18px}
footer{text-align:center;color:var(--muted);font-size:.74rem;line-height:1.6;margin-top:24px}
:focus-visible{outline:3px solid #3d6ea8;outline-offset:2px}
</style>
</head>
