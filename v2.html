<style>
@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Mulish";src:url(fonts/mulish-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
/* Variante "Navy": menu a pulsanti grandi su fondo blu, contatti a scomparsa */
:root{--bg:#14243a;--bg2:#1c3150;--line:rgba(255,255,255,.14);--fg:#fff;--muted:#a9b7c9;--steel:#c9d2dc;--accent:#7fa6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Mulish",-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
.photo{position:relative;height:250px;margin:0 -18px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,36,58,.35),rgba(20,36,58,.15) 40%,var(--bg) 100%)}
.bar{position:absolute;z-index:2;top:calc(14px + env(safe-area-inset-top,0px));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.bar img{height:32px}
.lang{position:relative}
.lang button{font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.08em;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 12px;cursor:pointer}
.lang ul{position:absolute;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:#fff;color:#17263a;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);min-width:150px;z-index:5}
.lang ul[hidden]{display:none}
.lang li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;font-size:.92rem;cursor:pointer;color:#17263a}
.lang li button[aria-current="true"]{background:#eef2f6;font-weight:700}
.head{margin-top:-46px;position:relative}
.kicker{font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{margin:8px 0 6px;font-size:1.6rem;line-height:1.15;font-weight:800;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--muted);font-size:.95rem;line-height:1.45}
.menu{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.item:active{transform:scale(.985)}
.ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(127,166,214,.16);color:var(--accent)}
.ic svg{width:24px;height:24px}
.t{flex:1;min-width:0}
.t b{display:block;font-size:1.05rem;font-weight:800}
.t span{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .2s}
.item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.panel{display:grid;gap:10px;padding:4px 0 6px}
.panel[hidden]{display:none}
.person{padding:14px;border-radius:14px;border:1px solid var(--line)}
.person b{font-size:1rem}
.person small{display:block;color:var(--muted);margin:2px 0 12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:10px;background:rgba(255,255,255,.07);font-size:.7rem;font-weight:700;color:var(--steel)}
.acts a.save{background:#fff;color:#14243a}
.acts svg{width:19px;height:19px}
.social{display:flex;justify-content:center;gap:14px;margin:26px 0 8px}
.social a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--steel)}
.social svg{width:22px;height:22px}
footer{text-align:center;color:var(--muted);font-size:.74rem;line-height:1.6;margin-top:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
